        /* =====================================
           DEMO PAGE ROUTING
        ===================================== */

        function getDemoPath(serviceName, categoryKey) {
            const service = serviceName.toLowerCase();

            // Restaurant and food demos
            if (
                service.includes("restaurant") ||
                service.includes("cafe") ||
                service.includes("bakery") ||
                service.includes("food delivery") ||
                service.includes("food truck") ||
                service.includes("cloud kitchen") ||
                service.includes("personal chef") ||
                service.includes("catering")
            ) {
                return "../demos/restaurant/index.html";
            }

            // Salon and spa demo
            if (
                service.includes("salon") ||
                service.includes("spa") ||
                service.includes("makeup") ||
                service.includes("nail") ||
                service.includes("barbershop") ||
                service.includes("lash") ||
                service.includes("skincare") ||
                service.includes("beauty clinic")
            ) {
                return "../demos/spa/index.html";
            }

            // E-commerce demo
            if (
                service.includes("store") ||
                service.includes("e-commerce") ||
                service.includes("ecommerce") ||
                service.includes("fashion") ||
                service.includes("electronics") ||
                service.includes("grocery") ||
                service.includes("jewelry") ||
                service.includes("handmade") ||
                service.includes("auto parts")
            ) {
                return "../demos/ecommerce/index.html";
            }

            // Tyre shop demo: check before general automotive routes
            if (
                service.includes("tyre") ||
                service.includes("tire")
            ) {
                return "../demos/tyres/index.html";
            }

            // Car wash and detailing demo
            if (
                service.includes("car wash") ||
                service.includes("detailing") ||
                service.includes("auto repair")
            ) {
                return "../demos/carwash/index.html";
            }

            // Car sales demo
            if (
                service.includes("car dealership") ||
                service.includes("car selling") ||
                service.includes("vehicle sales") ||
                service.includes("motorcycle dealer")
            ) {
                return "../demos/carselling/index.html";
            }

            // Other automotive services
            if (categoryKey === "automotive") {
                return "../demos/carwash/index.html";
            }

            // Categories without a dedicated demo
            return "../index.html#portfolio";
        }

        /* =====================================
           RENDER SELECTED CATEGORY
        ===================================== */

        const params = new URLSearchParams(window.location.search);
        const categoryKey = params.get("type") || "";
        const category = categories[categoryKey];

        const titleElement = document.getElementById("category-title");
        const descriptionElement = document.getElementById("category-description");
        const grid = document.getElementById("type-grid");

        if (category) {
            document.title = category.title + " | ProConnect";
            titleElement.textContent = category.title;
            descriptionElement.textContent = category.description;

            category.types.forEach(function(item) {
                const card = document.createElement("article");
                card.className = "type-card";

                const title = document.createElement("h2");
                title.textContent = item[0];

                const description = document.createElement("p");
                description.textContent = item[1];

                const link = document.createElement("a");
                link.className = "request-link";
                link.textContent = "View Website Demo →";
                link.href = getDemoPath(item[0], categoryKey);

                card.appendChild(title);
                card.appendChild(description);
                card.appendChild(link);

                grid.appendChild(card);
            });

        } else {
            document.title = "Category Not Found | ProConnect";
            titleElement.textContent = "Category Not Found";
            descriptionElement.textContent =
                "Please select a website category from our services page.";

            const message = document.createElement("div");
            message.className = "not-found";

            const link = document.createElement("a");
            link.className = "request-link";
            link.href = "services.html";
            link.textContent = "Browse All Categories →";

            message.appendChild(link);
            grid.appendChild(message);
        }
